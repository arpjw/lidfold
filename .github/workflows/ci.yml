name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Report toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check Xcode source parity
        run: scripts/check-xcode-project.sh

      - name: Build native macOS app
        run: |
          xcodebuild \
            -project LidFold.xcodeproj \
            -scheme LidFold \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test native macOS app
        run: |
          xcodebuild \
            test \
            -project LidFold.xcodeproj \
            -scheme LidFold \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
